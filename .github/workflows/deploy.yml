name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_ENV=production
            BUILD_VERSION=${{ github.run_number }}
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Prepare remote release directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            rm -rf /tmp/statuspulse-release
            mkdir -p /tmp/statuspulse-release

      - name: Copy deployment assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "docker-stack.yml,nginx,scripts"
          target: /tmp/statuspulse-release

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            sudo mkdir -p /opt/statuspulse/nginx /opt/statuspulse/scripts
            sudo cp /tmp/statuspulse-release/docker-stack.yml /opt/statuspulse/docker-stack.yml
            sudo cp -r /tmp/statuspulse-release/nginx/. /opt/statuspulse/nginx/
            sudo cp -r /tmp/statuspulse-release/scripts/. /opt/statuspulse/scripts/
            sudo chmod +x /opt/statuspulse/scripts/*.sh
            sudo chown -R "${USER}:${USER}" /opt/statuspulse
            cat > /tmp/statuspulse.env <<'EOF'
            STATUSPULSE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            DB_HOST=postgres
            DB_PORT=5432
            DB_NAME=${{ secrets.DB_NAME || 'statuspulse' }}
            DB_USER=${{ secrets.DB_USER || 'statuspulse' }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE || 'statuspulse' }}
            MYSQL_USER=${{ secrets.MYSQL_USER || 'statuspulse' }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            APP_PORT=${{ secrets.APP_PORT || '8000' }}
            DOMAIN=${{ secrets.STATUSPULSE_DOMAIN }}
            ACME_EMAIL=${{ secrets.ACME_EMAIL }}
            ALERT_WEBHOOK_URL=${{ secrets.ALERT_WEBHOOK_URL }}
            SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
            EOF
            sed -i 's/^            //' /tmp/statuspulse.env
            sudo install -o "${USER}" -g "${USER}" -m 0600 /tmp/statuspulse.env /opt/statuspulse/.env
            rm -f /tmp/statuspulse.env
            if ! command -v docker >/dev/null 2>&1; then
              if ! command -v curl >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y ca-certificates curl
              fi
              curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
              sudo sh /tmp/get-docker.sh
            fi
            sudo systemctl enable --now docker
            sudo touch /var/log/statuspulse-deploy.log
            sudo chown "${USER}:${USER}" /var/log/statuspulse-deploy.log
            sudo chmod 664 /var/log/statuspulse-deploy.log
            if docker info >/dev/null 2>&1; then
              export DOCKER_BIN="docker"
            else
              export DOCKER_BIN="sudo docker"
            fi
            export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            export HEALTH_URL="${{ secrets.HEALTH_URL }}"
            /opt/statuspulse/scripts/deploy-swarm.sh "$IMAGE"

      - name: Post Slack deployment notification
        if: always()
        run: |
          status="${{ job.status }}"
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' \
              --data "{\"text\":\"StatusPulse deploy ${status}: ${{ github.sha }}\"}" \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          fi
