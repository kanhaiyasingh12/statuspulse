name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Prepare remote release directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            rm -rf /tmp/statuspulse-release
            mkdir -p /tmp/statuspulse-release

      - name: Copy deployment assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "docker-stack.yml,nginx,scripts"
          target: /tmp/statuspulse-release

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            sudo mkdir -p /opt/statuspulse/nginx /opt/statuspulse/scripts
            sudo cp /tmp/statuspulse-release/docker-stack.yml /opt/statuspulse/docker-stack.yml
            sudo cp -r /tmp/statuspulse-release/nginx/. /opt/statuspulse/nginx/
            sudo cp -r /tmp/statuspulse-release/scripts/. /opt/statuspulse/scripts/
            sudo chmod +x /opt/statuspulse/scripts/*.sh
            sudo chown -R "${USER}:${USER}" /opt/statuspulse
            export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            export HEALTH_URL="${{ secrets.HEALTH_URL }}"
            /opt/statuspulse/scripts/deploy-swarm.sh "$IMAGE"

      - name: Post Slack deployment notification
        if: always()
        run: |
          status="${{ job.status }}"
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' \
              --data "{\"text\":\"StatusPulse deploy ${status}: ${{ github.sha }}\"}" \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          fi
